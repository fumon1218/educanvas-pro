<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155bc8"><link rel="manifest" href="manifest.webmanifest"><title>우리학교 한눈에</title><style>
*{box-sizing:border-box}body{font:15px system-ui,'Malgun Gothic',sans-serif;background:#f4f7fc;color:#22334c;margin:0}.wrap{max-width:680px;margin:auto;padding-bottom:95px}header{padding:35px 21px;color:white;background:linear-gradient(120deg,#1556bd,#3891d8);border-radius:0 0 25px 25px}header h1{font-size:27px;margin:5px 0}header p{opacity:.9;font-size:13px}main{padding:0 15px}.card{background:white;border:1px solid #e6edf5;box-shadow:0 6px 28px #153c6210;border-radius:20px;margin:16px 0;padding:18px}.search{margin-top:-13px;position:relative}.row{display:flex;gap:8px}.row input{min-width:0;flex:1}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #d6e1f0}input{width:100%;font-size:16px}button{background:#155bc8;color:white;border:0;font-weight:700;cursor:pointer}.light{background:#eef5ff;color:#1556a9}.result{display:block;width:100%;text-align:left;background:#f5f9ff;color:#253751;margin:9px 0;border:1px solid #e2ebf7}.result small{display:block;margin-top:5px;color:#677b97}.muted{color:#71839d;font-size:13px;line-height:1.6}.item{padding:13px 3px;border-bottom:1px solid #edf0f5}.item:last-child{border:0}.date{font-size:12px;color:#155bc8;font-weight:bold}.dish{white-space:pre-line;line-height:1.8}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact{background:#f6f9fd;padding:12px;border-radius:12px;overflow-wrap:anywhere}.fact small{display:block;color:#70819a;margin-bottom:5px}.bar{display:flex;align-items:center;justify-content:space-between;gap:7px}.bar input{width:165px;font-size:14px;padding:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffe;backdrop-filter:blur(12px);border-top:1px solid #e4ebf5;display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}.nav-inner{max-width:680px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.nav button{background:transparent;color:#70819a;font-size:12px;padding:8px 0}.nav button[aria-selected=true]{background:#e8f2ff;color:#155bc8}.nav span{display:block;font-size:21px}h2{font-size:17px;margin:0 0 12px}.status{font-size:13px;color:#52708d;margin:10px 0}.hide{display:none!important}details{margin:12px 0}summary{color:#2561a5;cursor:pointer}footer{text-align:center;font-size:11px;color:#8191a6;line-height:1.7;margin:20px 0}@media(max-width:355px){.facts{grid-template-columns:1fr}header h1{font-size:23px}}</style></head><body><div class="wrap"><header><div style="font-size:11px;font-weight:700">NEIS SCHOOL PORTAL</div><h1>🏫 우리학교 한눈에</h1><p>학교정보 · 학사일정 · 오늘의 급식</p></header><main><section class="card search"><div class="bar"><h2>학교 찾기</h2><button id="keybtn" class="light" type="button">🔑 API 설정</button></div><form id="form" class="row"><input id="name" placeholder="학교명 입력" aria-label="학교명" required><button>검색</button></form><div id="msg" role="status" class="status"></div><div id="results"></div><details id="settings"><summary>나이스 API 인증키</summary><p class="muted">인증키는 현재 탭의 세션에만 저장됩니다. 정적 웹앱이므로 인증키가 브라우저 네트워크 요청에 노출될 수 있습니다. 비밀 업무용 키는 사용하지 마세요.</p><div class="row"><input id="key" type="password" placeholder="API 인증키" aria-label="API 인증키"><button id="save" type="button" class="light">적용</button></div><p class="muted"><a href="https://open.neis.go.kr" target="_blank" rel="noopener">나이스 개방포털에서 발급</a></p></details></section><section class="card hide" id="panel"><div style="background:#edf5ff;border-radius:13px;padding:14px;margin-bottom:14px"><strong id="school" style="font-size:19px"></strong><div id="address" class="muted"></div></div><div class="bar"><h2 id="title">학교 기본정보</h2><input id="month" type="month" aria-label="조회 연월"></div><div id="detail"></div></section><footer>자료 출처: 교육부 나이스 교육정보 개방포털<br>비공식 공공정보 조회 서비스</footer></main></div><nav class="nav"><div class="nav-inner"><button data-tab="info" aria-selected="true"><span>🏫</span>학교정보</button><button data-tab="schedule" aria-selected="false"><span>📅</span>학사일정</button><button data-tab="meal" aria-selected="false"><span>🍱</span>급식정보</button></div></nav><script>
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let key=sessionStorage.getItem('neis-key')||'',school=null,tab='info',counter=0;const d=new Date();$('month').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');$('key').value=key;$('month').hidden=true;if(!key){$('settings').open=true;$('msg').textContent='API 키를 먼저 설정하세요.'}function msg(s){$('msg').textContent=s}function fmt(s){s=String(s||'');return /^\d{8}$/.test(s)?s.slice(0,4)+'.'+s.slice(4,6)+'.'+s.slice(6):esc(s)}function period(){const [y,m]=$('month').value.split('-').map(Number),p=y+String(m).padStart(2,'0');return [p+'01',p+String(new Date(y,m,0).getDate()).padStart(2,'0')]}async function api(ep,params){if(!key)throw Error('API 키를 설정하세요.');const u=new URL('https://open.neis.go.kr/hub/'+ep);Object.entries({...params,KEY:key,Type:'json',pIndex:1,pSize:ep==='schoolInfo'?100:1000}).forEach(([k,v])=>u.searchParams.set(k,v));let r;try{r=await fetch(u,{cache:'no-store'})}catch(e){throw Error('네트워크 또는 API CORS 정책 때문에 직접 조회하지 못했습니다.')}if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(Array.isArray(j[ep]))return j[ep].find(x=>x.row)?.row||[];if(j.RESULT?.CODE==='INFO-200')return [];throw Error(j.RESULT?.MESSAGE||'데이터를 읽을 수 없습니다.')} $('keybtn').onclick=()=>{$('settings').open=true;$('key').focus()};$('save').onclick=()=>{key=$('key').value.trim();key?sessionStorage.setItem('neis-key',key):sessionStorage.removeItem('neis-key');$('settings').open=false;msg(key?'인증키가 설정되었습니다.':'인증키가 삭제되었습니다.')};$('form').onsubmit=async e=>{e.preventDefault();const id=++counter;msg('검색 중…');$('results').replaceChildren();try{const rows=await api('schoolInfo',{SCHUL_NM:$('name').value.trim()});if(id!==counter)return;msg(rows.length+'개 학교 검색');rows.forEach(s=>{const b=document.createElement('button');b.className='result';b.type='button';b.innerHTML='<strong>'+esc(s.SCHUL_NM)+'</strong><small>'+esc(s.ATPT_OFCDC_SC_NM)+' · '+esc(s.ORG_RDNMA)+'</small>';b.onclick=()=>{school=s;$('school').textContent=s.SCHUL_NM;$('address').textContent=s.ORG_RDNMA||'';$('results').replaceChildren();$('panel').classList.remove('hide');msg('학교를 선택했습니다.');render();$('panel').scrollIntoView({behavior:'smooth'})};$('results').append(b)})}catch(e){if(id===counter)msg(e.message)}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));if(!school){msg('먼저 학교를 선택하세요.');return}render()});$('month').onchange=render;function render(){if(!school)return;const id=++counter;$('title').textContent={info:'학교 기본정보',schedule:'학사일정',meal:'급식정보'}[tab];$('month').hidden=tab==='info';if(tab==='info'){const cols=[['학교명','SCHUL_NM'],['학교 종류','SCHUL_KND_SC_NM'],['관할 교육청','ATPT_OFCDC_SC_NM'],['설립','FOND_SC_NM'],['주소','ORG_RDNMA'],['전화','ORG_TELNO'],['홈페이지','HMPG_ADRES'],['학교 코드','SD_SCHUL_CODE']];$('detail').innerHTML='<div class="facts">'+cols.map(([n,k])=>'<div class="fact"><small>'+n+'</small>'+esc(school[k]||'정보 없음')+'</div>').join('')+'</div>';return}load(id)}async function load(id){$('detail').innerHTML='<div class="status">자료를 불러오는 중…</div>';const [a,b]=period(),base={ATPT_OFCDC_SC_CODE:school.ATPT_OFCDC_SC_CODE,SD_SCHUL_CODE:school.SD_SCHUL_CODE},cal=tab==='schedule';try{const rows=await api(cal?'SchoolSchedule':'mealServiceDietInfo',cal?{...base,AA_FROM_YMD:a,AA_TO_YMD:b}:{...base,MLSV_FROM_YMD:a,MLSV_TO_YMD:b});if(id!==counter)return;rows.sort((x,y)=>String(x.AA_YMD||x.MLSV_YMD).localeCompare(String(y.AA_YMD||y.MLSV_YMD)));$('detail').innerHTML=rows.length?rows.map(r=>cal?'<article class="item"><div class="date">'+fmt(r.AA_YMD)+'</div><strong>'+esc(r.EVENT_NM)+'</strong><div class="muted">'+esc(r.EVENT_CNTNT||'')+'</div></article>':'<article class="item"><div class="date">'+fmt(r.MLSV_YMD)+' · '+esc(r.MMEAL_SC_NM)+'</div><div class="dish">'+esc((r.DDISH_NM||'').replace(/<br\s*\/?\s*>/gi,'\n'))+'</div><div class="muted">'+esc(r.CAL_INFO||'')+'</div></article>').join(''):'<p class="muted">조회 가능한 자료가 없습니다.</p>'}catch(e){if(id===counter)$('detail').textContent=e.message}}
</script></body></html>
