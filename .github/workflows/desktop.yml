name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log
      - name: Show build error
        if: failure()
        working-directory: desktop
        shell: bash
        run: echo "::error::$(tail -c 3500 build.log | tr '\n' ' ' | tr -d '%')"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: 옥쌤보드 데스크톱 ${{ steps.v.outputs.version }}
          body: |
            옥쌤보드 데스크톱 설치 파일입니다. 수업 창의 웹 브라우저에서 네이버·다음 등 모든 사이트를 열 수 있습니다.
            - 맥(애플 칩 M1~M4): OkssamBoard-…-mac-arm64.dmg / 인텔 맥: …-mac-x64.dmg (처음 열 때 오른쪽 클릭 → 열기)
            - 윈도우: OkssamBoard-…-win-x64.exe (PC 보호 창에서 추가 정보 → 실행)
          files: out/**/*
