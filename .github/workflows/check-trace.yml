name: Check trace branch (temporary)
on:
  push:
    branches: ["claude/culture-trace"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build && npm run build:lite
      - name: Walkthrough
        continue-on-error: true
        run: |
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          # 시험용: 로그인 화면 없이 (이 작업 안에서만)
          sed -i 's#<AccessGate>#<>#; s#</AccessGate>#</>#' src/main.tsx
          npx vite build >/dev/null
          npx vite preview --port 4173 --strictPort &
          sleep 5
          mkdir -p shots
          cat > walk.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 860 } });
          const errs = [];
          p.on('pageerror', e => errs.push(String(e)));
          let n = 0; const shot = async t => { await p.waitForTimeout(1200); await p.screenshot({ path: `shots/${++n}-${t}.png` }); };
          const step = async (t, fn) => { try { await fn(); } catch (e) { console.log('STEP FAIL', t, String(e).slice(0, 200)); } await shot(t); };
          await p.goto('http://localhost:4173/educanvas-pro/?test=1', { waitUntil: 'networkidle' });
          await shot('start');
          await p.keyboard.press('Escape');
          await step('notes', () => p.getByRole('button', { name: '내 노트 목록' }).first().click({ timeout: 5000 }));
          await step('culture', () => p.getByRole('tab', { name: /교양/ }).first().click({ timeout: 5000 }));
          await step('newmenu', () => p.getByRole('button', { name: /새 교양 노트/ }).click({ timeout: 5000 }));
          await step('picker', () => p.getByRole('menuitem', { name: /따라 쓰기/ }).first().click({ timeout: 5000 }));
          await step('pick-cheonja', () => p.getByRole('dialog', { name: '따라 쓰기 노트 만들기' }).getByRole('button', { name: '천자문' }).click({ timeout: 8000 }));
          await step('made', async () => { await p.getByRole('button', { name: '노트 만들기' }).click({ timeout: 5000 }); await p.waitForTimeout(4000); });
          console.log('page errors:', JSON.stringify(errs));
          await b.close();
          JS
          node walk.mjs
      - name: Publish shots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q && git checkout -q -b claude/ci-shots-trace && git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" claude/ci-shots-trace
